<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
    <style>
        body {
            background-color: #272727;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>hello world</h1>
    <h2>meio besta mais tem que escrever algumas coisa.</h2>
    <script>

        var n1 = Number(window.prompt('Digite um número: ')) // String
        var n2 = Number(window.prompt('Digite outro número: ')) // String
        var sn1 = n1 + n2
        window.alert('A soma dos valores é ' + sn1) // Concatenação
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
</body>

</html>
